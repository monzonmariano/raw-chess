<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Raw Chess</title>
    <link rel="stylesheet" href="chessboard-1.0.0.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    
    <div class="app-container">
        <h1>Raw Chess Server</h1>
        
        <!-- THE CURTAIN -->
        <div id="menu">
            <div id="menuOptions">
                <!-- Name -->
                <div class="dark-panel">
                    <label for="playerNameInput" style="font-size: 18px; font-weight: bold;">👤 Your Name: </label>
                    <input type="text" id="playerNameInput" placeholder="Guest" maxlength="12" style="width: 150px; text-align: center;">
                </div>

                <!-- Time Selector -->
                <div class="dark-panel">
                    <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">⏱️ Time per player:</div>
                    <div class="level-container">
                        <button class="level-btn time-btn active" style="width: 60px;" data-val="5">5 M</button>
                        <button class="level-btn time-btn track" style="width: 60px;" data-val="10">10 M</button>
                        <button class="level-btn time-btn track" style="width: 60px;" data-val="15">15 M</button>
                        <button class="level-btn time-btn track" style="width: 60px;" data-val="30">30 M</button>
                        <button class="level-btn time-btn track" style="width: 60px;" data-val="60">1 H</button>
                    </div>
                </div>

                <h2>Multiplayer</h2>
                <button id="findMatchBtn" class="menu-btn">🎲 Random Match</button>
                
                <!-- Private Room Controls -->
                <div style="margin-top: 15px; padding: 15px; border: 1px solid #4CAF50; border-radius: 5px;">
                    <input type="text" id="customRoomCodeInput" placeholder="CUSTOM CODE (OPTIONAL)" maxlength="10" style="font-size: 14px; width: 90%; margin-bottom: 10px; text-transform: uppercase; text-align: center;">
                    <button id="createPrivateBtn" class="menu-btn" style="background-color: #9C27B0; width: 90%;">🏠 Create Private Room</button>
                    
                    <hr style="margin: 15px 0; border-color: #444;">
                    
                    <div style="margin-top: 10px;">
                        <input type="text" id="roomCodeInput" placeholder="CODE" maxlength="10" style="width: 100px; text-transform: uppercase; text-align: center;">
                        <button id="joinPrivateBtn" class="menu-btn" style="background-color: #FF9800; padding: 10px 15px;">Join</button>
                    </div>
                </div>
                
                <hr style="margin: 30px 0; border-color: #444;">
                
                <h2>Play vs Computer</h2>
                
                <div style="margin: 15px 0;">
                    <div style="font-size: 18px; margin-bottom: 10px;">AI Level:</div>
                    <div id="levelTrack" class="level-container">
                        <button class="level-btn ai-lvl-btn" data-val="1">1</button>
                        <button class="level-btn ai-lvl-btn" data-val="2">2</button>
                        <button class="level-btn ai-lvl-btn" data-val="3">3</button>
                        <button class="level-btn ai-lvl-btn" data-val="4">4</button>
                        <button class="level-btn ai-lvl-btn" data-val="5">5</button>
                        <button class="level-btn ai-lvl-btn" data-val="6">6</button>
                        <button class="level-btn ai-lvl-btn" data-val="7">7</button>
                        <button class="level-btn ai-lvl-btn" data-val="8">8</button>
                        <button class="level-btn ai-lvl-btn" data-val="9">9</button>
                        <button class="level-btn ai-lvl-btn" data-val="10">10</button>
                    </div>
                </div>
                
                <button id="playAiBtn" class="menu-btn ai-btn">Start AI Game</button>
            </div>
            
            <div id="lobbyWaiting" class="hidden">
                <div class="spinner"></div>
                <p id="waitingText">Searching for an opponent...</p>
                <h1 id="displayRoomCode" style="color: #9C27B0; letter-spacing: 2px;"></h1>
                <button id="shareRoomBtn" class="menu-btn hidden" style="background-color: #2196F3; margin-top: 0; padding: 10px 20px;">📤 Share Code</button>
                <br>
                <button id="cancelMatchBtn" class="menu-btn cancel-btn">Cancel Search</button>
            </div>
        </div>

        <!-- THE STAGE -->
        <div id="gameArea" class="hidden">
            <h2 id="status" style="margin-bottom: 15px;">Waiting for opponent...</h2>
            
            <div class="player-bar">
                <h3 id="opponentNameLabel">Opponent</h3>
                <div id="opponentClock" class="clock">00:00</div>
            </div>
            
            <div id="board" class="responsive-box" style="margin: 10px auto;"></div>
        
        <!-- Player Header (Bottom) -->
        <div class="player-bar">
            <h3 id="playerNameLabel">Guest</h3>
            <div id="playerClock" class="clock">00:00</div>
        </div>
        
        <!-- In-Game Controls -->
        <div id="gameControls" class="responsive-box" style="display: flex; justify-content: space-between; margin-top: 10px; margin-left: auto; margin-right: auto;">
            <button id="offerDrawBtn" class="action-btn" style="background-color: #607D8B;">🤝 Offer Draw</button>
            <button id="resignBtn" class="action-btn" style="background-color: #d32f2f;">🏳️ Resign</button>
        </div>
            
            <button id="quitBtn" class="menu-btn cancel-btn" style="margin-top: 20px;">Quit to Menu</button>
        </div>
    </div>
    
    <!-- Modals -->
    <div id="promotionModal" class="modal-overlay hidden">
        <div class="promotion-content">
            <h3 style="margin-top: 0; color: #4CAF50;">Promote Pawn</h3>
            <button class="promo-btn" data-piece="q">♛ Queen</button>
            <button class="promo-btn" data-piece="n">♞ Knight</button>
            <button class="promo-btn" data-piece="r">♜ Rook</button>
            <button class="promo-btn" data-piece="b">♝ Bishop</button>
            <button id="cancelPromoBtn" class="menu-btn cancel-btn" style="margin-top: 15px; width: 100%;">Cancel</button>
        </div>
    </div>

    <div id="drawOfferModal" class="modal-overlay hidden" style="z-index: 1001;">
        <div class="promotion-content">
            <h3 style="margin-top: 0; color: #fff;">Opponent offers a draw</h3>
            <button id="acceptDrawBtn" class="promo-btn" style="background-color: #4CAF50;">✅ Accept</button>
            <button id="declineDrawBtn" class="promo-btn" style="background-color: #f44336;">❌ Decline</button>
        </div>
    </div>

    <div id="customAlertModal" class="modal-overlay hidden" style="z-index: 2000;">
        <div class="promotion-content" style="width: 280px; text-align: center;">
            <h3 id="customAlertText" style="margin-top: 0; color: #fff; font-size: 18px; line-height: 1.4;">Mensaje</h3>
            <button id="closeAlertBtn" class="promo-btn" style="background-color: #008CBA; font-size: 18px;">OK</button>
        </div>
    </div>

    <script src="jquery-3.5.1.min.js"></script>
    <script src="chessboard-1.0.0.min.js"></script>
    <script src="chess.min.js"></script>
    <script src="game.js"></script>
</body>
</html>
